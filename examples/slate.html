<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Example candidate slate | Lead Nap Cave Attendant (sample)</title>
<meta name="description" content="Example one-page candidate slate for a pretend role at a pretend dragon daycare. Mock data only.">
<style>
/* Example page. Tokens copied from the portfolio stylesheet so the page shares the site's look.
   Dark site backdrop, light letter-size sheet. Sheet sizes are in px so screen and print match.
   No fixed or sticky layers. Nothing animates. */
:root{
 --bg:#070B14;--ink:#F1F5F9;--indigo-text:#818CF8;--cta:#4F46E5;--cyan:#22D3EE;
 --paper:#FFFFFF;--pi:#0F172A;--pm:#475569;--pb:#64748B;--pl:#CBD5E1;--acc:#4338CA;--tint:#EEF2FF;
 --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:400 1.0625rem/1.55 var(--sans);background-color:var(--bg);
 background-image:radial-gradient(56rem 34rem at 8% 0,rgba(99,102,241,.24),transparent 62%),radial-gradient(44rem 30rem at 100% 18%,rgba(79,70,229,.16),transparent 62%);
 background-repeat:no-repeat}
h1,h2,p,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px}
.sheet :focus-visible{outline-color:var(--acc)}
.wrap{max-width:calc(8.5in + 40px);margin-inline:auto;padding:14px clamp(10px,3vw,20px) 40px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.textlink{display:inline-flex;align-items:center;min-height:44px;color:var(--indigo-text);font-weight:700;text-decoration:underline;text-underline-offset:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:14px;background:var(--cta);color:#fff;font-weight:700;border:1px solid rgba(255,255,255,.18);cursor:pointer}

.sheet{display:grid;gap:14px;align-content:start;margin-inline:auto;background:var(--paper);color:var(--pi);padding:16px;font-size:14px;line-height:1.45;
 -webkit-print-color-adjust:exact;print-color-adjust:exact}
@media (min-width:880px){.sheet{width:8.5in;min-height:11in;padding:40px 48px}}
.cap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding-bottom:10px;border-bottom:1px solid var(--pl);font-weight:600}
.mock{padding:3px 8px;border:1px solid var(--pb);border-radius:6px;font:600 11px/1.6 var(--mono);letter-spacing:.12em}
.mast{display:grid;gap:6px}
.kicker,.sheet h2,.facts dt{font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.sheet h1{font-size:34px;line-height:1.05;letter-spacing:-.025em;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chips li{padding:3px 10px;background:var(--tint);border:1px solid var(--pb);border-radius:999px;font-size:12.5px;font-weight:600}
.blk{display:grid;gap:8px;align-content:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
.str{display:grid;gap:5px}
.str li{padding-left:14px;background:linear-gradient(var(--acc),var(--acc)) 0 .68em/7px 2px no-repeat}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.facts>div{padding:8px 10px;border:1px solid var(--pl);border-radius:8px}
.facts dt{margin-bottom:3px}
.facts dd{font-weight:600}
.time{display:grid;gap:7px}
.trow{display:grid;grid-template-columns:15rem 1fr 6.2rem;gap:4px 12px;align-items:center}
.trow span{color:var(--pm)}
.track{height:14px;background:#E2E8F0;border-radius:4px}
.bar{display:block;height:100%;background:var(--acc);border:1px solid var(--acc);border-radius:4px}
.dur{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px}
.qa dt{font-weight:700}
.pay{padding:8px 10px;border:1px solid var(--pl);border-radius:8px}
.call{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.call button{min-height:44px;padding:0 14px;background:var(--paper);border:1px solid var(--acc);border-radius:10px;color:var(--acc);font-weight:700;cursor:pointer}
.say{flex:1 1 12rem;color:var(--pm)}
.rec{padding-top:10px;border-top:1px solid var(--pl)}
.rec span,.fine{color:var(--pm)}
@media (max-width:600px){
 .two,.qa{grid-template-columns:1fr}
 .facts{grid-template-columns:1fr 1fr}
 .trow{grid-template-columns:1fr 5.6rem}
 .trow>div:first-child{grid-column:1/-1}
}
@media print{
 @page{size:letter;margin:0}
 body{background:#fff}
 .top{display:none}
 .wrap{max-width:none;padding:0}
 /* Print fit: spacing only, type stays the same size. Small labels go up to 12px (9pt), the print floor. */
 .sheet{width:8.5in;height:11in;min-height:0;margin:0;padding:32px 48px;gap:9px;overflow:hidden}
 .blk{gap:6px}
 .time{gap:5px}
 .call button{min-height:36px}
 .rec{padding-top:8px}
 .kicker,.sheet h2,.facts dt,.mock{font-size:12px}
}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <a class="textlink" href="../">Back to the portfolio</a>
  <button type="button" class="btn" id="print">Print or save as PDF</button>
 </div>
 <main class="sheet" id="sheet">
  <noscript><p>This example slate is drawn by a small script on this page. Turn on JavaScript to view it. SAMPLE / MOCK DATA.</p></noscript>
 </main>
</div>
<script>
'use strict';
/* ===== SLATE DATA: START =====
   The one source for everything shown on the slate. Batch B (s10) reuses this block as is.
   Every name, place, role and credential is invented. No contact values. No pay figures.
   months = length of the stint; bar width = months / longest stint. */
const SLATE = {
  caption: 'An example of what TwoMorrows HR could do for a business.',
  mock: 'SAMPLE / MOCK DATA',
  masthead: 'Candidate slate',
  eyebrow: 'Smolder & Snooze Dragon Daycare · pretend employer',
  code: 'EQ-07',
  name: 'Ember Q.',
  chips: [['Role', 'Lead Nap Cave Attendant (sample)'], ['Site', 'Mount Singe Lair (pretend)'], ['Status', 'Sample']],
  writeup: 'Ember has spent more than eight years keeping small, loud and now and then flammable creatures calm, fed and asleep on schedule. Runs a nap room from a written checklist, hands off every shift in writing, and has trained new attendants along the way. Ready to lead a crew.',
  strengths: [
    ['Calm when it counts', 'settled a twelve-hatchling nap room after a surprise sneeze of fire, with no blankets singed.'],
    ['Routines that stick', 'wrote the nap cave checklist the last crew still uses.'],
    ['Teaches as the work goes', 'trained four new attendants, and all four stayed on.'],
  ],
  facts: [
    ['Experience', '8 yrs 6 mos in creature care'],
    ['Earliest start', 'Two moons after an offer'],
    ['Shifts', 'Midday nap or dawn roar'],
    ['Credential', 'Fireproof Mitten Safety, Level 2 (pretend)'],
  ],
  roles: [
    { role: 'Nap Cave Attendant', place: 'Soot Lake Annex', months: 42, why: 'Ready to lead a crew, and no lead roles were open there.' },
    { role: 'Hatchling Feeder', place: 'Cinder Creek Creche', months: 28, why: 'Wanted full-time hours. The creche offered part-time only.' },
    { role: 'Egg Turner', place: 'Warm Ledge Hatchery', months: 21, why: 'A seasonal post that ended when hatching season did.' },
    { role: 'Weekend Smoke Watcher', place: 'Puff Hill Stables', months: 11, why: 'A weekend job while training. Left for a full-time post.' },
  ],
  pay: 'Aligned with the posted range.',
  calls: ['Love them', 'Like them', 'Not a fit', 'Feedback'],
  callIdle: 'Sample only. Nothing is sent.',
  recruiter: { name: 'Pat Placeholder', title: 'Chief Talent Wrangler (sample)', note: 'Contact details are left out of this sample.' },
};
/* ===== SLATE DATA: END ===== */

// No storage, no network. Draws the sheet once from SLATE; nothing animates.
(function () {
  function h(tag, props) {
    const e = document.createElement(tag);
    for (const k in props || {}) {
      if (k === 'text') e.textContent = props[k]; else e.setAttribute(k, props[k]);
    }
    for (let i = 2; i < arguments.length; i++) [].concat(arguments[i]).forEach(function (c) { if (c != null) e.append(c); });
    return e;
  }
  const dur = function (m) {
    const y = Math.floor(m / 12), r = m % 12;
    return [y ? y + (y === 1 ? ' yr' : ' yrs') : '', r ? r + (r === 1 ? ' mo' : ' mos') : ''].filter(Boolean).join(' ');
  };
  const blk = function (id, title) {
    return h('section', { class: 'blk', 'aria-labelledby': id }, h('h2', { id: id, text: title }), [].slice.call(arguments, 2));
  };
  const D = SLATE, longest = Math.max.apply(null, D.roles.map(function (r) { return r.months; }));
  const say = h('p', { class: 'say', role: 'status', text: D.callIdle });

  document.getElementById('sheet').replaceChildren(
    h('div', { class: 'cap' }, h('p', { text: D.caption }), h('p', { class: 'mock', text: D.mock })),
    h('header', { class: 'mast' },
      h('p', { class: 'kicker', text: D.masthead + ' · ' + D.code }),
      h('h1', { text: D.name }),
      h('p', { class: 'fine', text: D.eyebrow }),
      h('ul', { class: 'chips' }, D.chips.map(function (c) { return h('li', { text: c[0] + ': ' + c[1] }); }))),
    h('div', { class: 'two' },
      blk('s-w', 'Write-up', h('p', { text: D.writeup })),
      blk('s-s', 'Strengths', h('ul', { class: 'str' }, D.strengths.map(function (s) {
        return h('li', null, h('b', { text: s[0] + ': ' }), s[1]);
      })))),
    blk('s-f', 'At a glance', h('dl', { class: 'facts' }, D.facts.map(function (f) {
      return h('div', null, h('dt', { text: f[0] }), h('dd', { text: f[1] }));
    }))),
    blk('s-t', 'Past roles, most recent first', h('ul', { class: 'time' }, D.roles.map(function (r) {
      // Bar width = this stint / the longest stint, to one decimal of a percent.
      const w = Math.round(r.months / longest * 1000) / 10;
      return h('li', { class: 'trow' },
        h('div', null, h('b', { text: r.role }), h('span', { text: ' · ' + r.place })),
        h('div', { class: 'track', 'aria-hidden': 'true' }, h('i', { class: 'bar', style: 'width:' + w + '%' })),
        h('div', { class: 'dur', text: dur(r.months) }));
    }))),
    blk('s-q', 'Why they moved on', h('dl', { class: 'qa' }, D.roles.map(function (r) {
      return h('div', null, h('dt', { text: r.place }), h('dd', { text: r.why }));
    }))),
    h('p', { class: 'pay' }, h('b', { text: 'Pay: ' }), D.pay),
    blk('s-c', 'Your call', h('div', { class: 'call' }, D.calls.map(function (c) {
      const b = h('button', { type: 'button', text: c });
      b.addEventListener('click', function () { say.textContent = "Sample: would send '" + D.code + ' - ' + c + "'"; });
      return b;
    }), say)),
    h('p', { class: 'rec' }, h('b', { text: D.recruiter.name }), ', ' + D.recruiter.title + '. ', h('span', { text: D.recruiter.note })));

  document.getElementById('print').addEventListener('click', function () { window.print(); });
})();
</script>
</body>
</html>
