<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share card 1200x630: render to og-image.png</title>
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#070B14;color:#F1F5F9;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background-image:radial-gradient(700px 460px at 8% 0,rgba(99,102,241,.5),transparent 65%),
      radial-gradient(640px 440px at 100% 100%,rgba(79,70,229,.42),transparent 65%)}
  .frame{box-sizing:border-box;width:1104px;height:534px;margin:48px;padding:16px;border-radius:40px;
    background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.14);
    background-image:linear-gradient(135deg,rgba(129,140,248,.6),transparent 30%,transparent 70%,rgba(99,102,241,.5))}
  .plate{box-sizing:border-box;height:100%;border-radius:26px;background:#0F172A;border:1px solid rgba(255,255,255,.08);
    padding:52px 60px;display:flex;flex-direction:column;justify-content:space-between}
  .row{display:flex;align-items:center;gap:20px}
  .name{font-size:34px;font-weight:800;letter-spacing:-.01em}
  h1{margin:0;font-size:76px;line-height:1.04;letter-spacing:-.03em;font-weight:800;max-width:940px}
  h1 span{color:#22D3EE}
  .foot{display:flex;justify-content:space-between;align-items:center;font-size:26px;color:#A8B3CF}
  .chip{padding:10px 18px;border-radius:999px;background:#4F46E5;color:#fff;font-weight:700}
</style>
</head>
<body>
  <div class="frame"><div class="plate">
    <div class="row">
      <svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="2" y="2" width="44" height="44" rx="12" fill="#0F172A" stroke="#6366F1" stroke-width="2.5"/>
        <path d="M11 15v11a6 6 0 0 0 12 0V15M27 32V15l5.5 9 5.5-9v17" fill="none" stroke="#F1F5F9" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="name">Undrae Morrow</span>
    </div>
    <h1>HR and talent leader who designs and builds with <span>AI</span>.</h1>
    <div class="foot"><span>SHRM-CP &middot; Virginia Beach, VA</span><span class="chip">Interactive portfolio</span></div>
  </div></div>
</body>
</html>
